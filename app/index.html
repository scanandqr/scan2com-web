.pubcard.yl{position:relative;margin:14px 6px 0;background:color-mix(in srgb,#e8b923 9%,#fff)}html.dark .pubcard.yl{background:color-mix(in srgb,#e8b923 7%,#1b2023)}.pubcard.yl b{color:#9a7400}html.dark .pubcard.yl b{color:#f1c936}html.dark .pubcard.yl{color:#e9dca8}.pbfr{position:absolute;inset:-6px;pointer-events:none}.pbfr i{position:absolute;width:22px;height:22px;display:block;color:#e8b923}.pbfr i svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}.pbfr .tl{left:0;top:0}.pbfr .tr{right:0;top:0;transform:scaleX(-1)}.pbfr .bl{left:0;bottom:0;transform:scaleY(-1)}.pbfr .br{right:0;bottom:0;transform:scale(-1,-1)}

.body{flex:1;overflow:auto;padding-bottom:90px;background:#f7f7f7}

.page .ev{align-items:center;padding:0 14px;gap:14px;border-bottom:1px solid #dcdcdc;background:linear-gradient(#f1f1f1,#f7f7f7);cursor:pointer}
.page .ev.new{background:#fff6f5}
.page .ev .av{width:54px;height:54px}
.ev .t1{font-weight:400;font-size:19px;color:#1d1d1d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s1{font-size:15px;color:#8a8a8a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.page .ev.open{height:auto;min-height:83px;padding:12px 14px}.ev.open .t1,.ev.open .s1{white-space:normal}
.ev .rep{flex:none;font-size:13px;color:#1f86e0;text-decoration:none;border:1px solid #1f86e0;border-radius:14px;padding:4px 10px}
.feat svg{stroke-width:1.5}
.camwrap{position:relative;background:#000;border-radius:14px;overflow:hidden}
.camwrap video{width:100%;display:block}
.laser{position:absolute;left:4%;right:4%;top:6%;height:88%;animation:laser 2s ease-in-out infinite alternate;pointer-events:none;will-change:transform}
.laser::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:#ff1a1a;box-shadow:0 0 8px 2px rgba(255,30,30,.85),0 0 18px 4px rgba(255,0,0,.4);border-radius:2px}
@keyframes laser{from{transform:translateY(0)}to{transform:translateY(100%)}}
.busy{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:16px}
.busy i{display:block;width:42px;height:42px;margin:0 auto 12px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.camwrap.found .laser{animation-play-state:paused;opacity:.35}
.camwrap canvas.pts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.section{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em;margin:18px 0 4px}
.grp{display:flex;align-items:center;gap:8px;padding:12px 16px 6px;font-size:15px;font-weight:600;color:#3a3a3a;border-top:1px solid #e6e6e6}
.grp .n{margin-left:auto;font-size:12px;font-weight:500;color:#8a8a8a;white-space:nowrap}
.req::after{content:' *';color:#e8352b;font-weight:700}
.bad{border-color:#e8352b!important;background:#fff6f5}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}
.ic{display:block}
.ib{color:#555}
.bar .ib{color:#e0e0e0}
/* modo oscuro: colores propios (fotos, caras, botón on/off y QR mantienen su color) */
html.dark{--ink:#e8e8e8;--mut:#a0a4aa;--line:#2e3135;--bg:#121212;color-scheme:dark}
html.dark,html.dark body{background:#121212}
html.dark .pager,html.dark .body,html.dark .buybar{background:#121212;border-color:#2e3135}
html.dark .buybar b{color:#ddd}html.dark .foot2{background:#1e1f22;color:#ccc}
html.dark .item{background:#18191b;border-bottom-color:#2a2c2f}html.dark .item .t{color:#ececec}html.dark .page .ev{background:#18191b;border-bottom-color:#2a2c2f}html.dark .page .ev.new{background:#2a1c1b}html.dark .ev .t1{color:#ececec}html.dark .ev .s1{color:#9a9ea4}html.dark .item .s{color:#9a9ea4}html.dark .item.off .t,html.dark .item.off .s{color:#5f6368}
html.dark .grp{color:#cfcfcf;border-top-color:#2a2c2f}
html.dark .ib{color:#cfcfcf}
html.dark .btn.light{background:#2a2c2f;color:#e8e8e8}
html.dark input,html.dark textarea,html.dark select{background:#1e1f22;color:#e8e8e8;border-color:#34373b}
html.dark .compose{background:#1a1b1d;border-top-color:#2e3135}
html.dark .m.me{background:#1f3a24;color:#e8e8e8}html.dark .m.them{background:#2a2d22;color:#e8e8e8}html.dark .m .tm{color:#a0a4aa}
html.dark .tour{background:#1e1f22;box-shadow:0 4px 18px rgba(0,0,0,.5)}html.dark .tour .cap{color:#ddd}
html.dark .notice{background:#3a3218;color:#f1e3b0}
html.dark .ev.new,html.dark .page .ev.new{background:#2a1c1b}
html.dark .nbar{background:#2a1c1b;border-color:#5a2a26;color:#f3d0cc}html.dark .nbar b,html.dark .nbar div{color:#f3d0cc}html.dark .m.them::before{border-right-color:#2a2d22}html.dark .m.me::after{border-left-color:#1f3a24}
html.dark .howto{background:#16263a;border-color:#24405f;color:#cfe0f3}
html.dark .pill{background:#2a2c2f}
html.dark .dsg button{background:#1e1f22;border-color:#34373b;color:#e8e8e8}
html.dark .alarm{background:#121212;color:#eee}html.dark .alarm .msg{background:#2a1c1b;border-color:#5a2a26;color:#eee}
html.dark .bad{background:#2a1c1b}
html.dark .welcome{background:#121212}
/* en modo oscuro, resplandor blanco suave alrededor del botón on/off y de las caras */
.facew{position:relative;display:block;width:var(--s);height:var(--s)}
html.dark .pw,html.dark .facew img{border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.28),0 0 7px rgba(255,255,255,.16)}
html.dark [style*="background:#fff"]{background:#1e1f22!important}
html.dark [style*="color:#222"],html.dark [style*="color:#333"]{color:#e8e8e8!important}
html.dark [style*="color:#555"],html.dark [style*="color:#666"],html.dark [style*="color:#777"]{color:#a8acb2!important}
.ib{position:relative}.mdot{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#e8352b;border:2px solid #1e1e1e}
.qrbar-ib{color:var(--v2sub)!important}
.qrbar-ib svg{display:block;stroke-width:1.5}
.ib.dark{color:#e0e0e0}
.feat .fi{color:#8d9298;display:flex;justify-content:center;margin-bottom:4px}
.pill .ic{display:inline-block;vertical-align:-3px}
.btn .ic{display:inline-block;vertical-align:-4px;margin-right:6px}
.sw{flex:1;border:2px solid transparent;border-radius:12px;padding:10px 4px;cursor:pointer;color:#fff;font:inherit;font-size:12px;font-weight:600;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.sw i{font-style:italic;color:#111;text-shadow:none}
.sw.on{border-color:#111;box-shadow:0 0 0 2px #fff inset}
.tour{margin:12px;background:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:16px;display:flex;gap:14px;align-items:center}
.tour .play{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:#33b5e5;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(51,181,229,.4)}
.tour .cap{font-size:15px;color:#333;line-height:1.4;min-height:42px}
.tourmini{display:flex;gap:6px;align-items:center;margin:10px 16px 2px;background:none;border:1px solid #cfe3fb;color:#1f6fc5;border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
.pdfb{background:#e8352b!important;color:#fff!important;border-radius:12px;padding:6px 10px!important;display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.tour .x{background:none;border:0;color:#999;font-size:13px;cursor:pointer;padding:4px 0 0}
/* ayuda hablando: se oscurece todo menos lo que se explica */
.hl{z-index:50}
#spot{position:fixed;z-index:60;pointer-events:none;border-radius:12px;box-shadow:0 0 0 3px #33b5e5,0 0 18px 4px rgba(51,181,229,.55),0 0 0 200vmax rgba(0,0,0,.62);transition:left .2s,top .2s,width .2s,height .2s}
.item.hl,.ib.hl{position:relative;border-radius:12px}.btn.hl,.chk.hl,.star.hl,.tabs button.hl,.chips.hl{position:relative}
.pw.hl,.fab.hl{border-radius:50%}
.howto{margin:10px 16px 4px;background:#eef6ff;border:1px solid #cfe3fb;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;color:#33475b}
.howto summary{cursor:pointer;font-weight:600;color:#1f6fc5;list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:'ⓘ  '}
.howto ul{margin:6px 0 2px;padding-left:18px}
.pill{font-size:12px;background:#eef0f2;border-radius:8px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center;margin:2px 4px 2px 0}
.nbar{display:flex;gap:12px;align-items:center;margin:10px 12px 0;padding:12px 14px;background:#fff4f3;border:1px solid #f3c2bd;border-left:5px solid #e8352b;border-radius:12px;color:#5a1a14;font-size:14px;line-height:1.35;cursor:pointer}
.nbar svg{color:#e8352b;flex:none}
.nbtn{background:#e8352b;color:#fff;border-radius:16px;padding:7px 12px;font-weight:600;font-size:13px;flex:none}
.slideL{animation:slL .22s ease-out}.slideR{animation:slR .22s ease-out}
@keyframes slL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.body{touch-action:pan-y}
.callmsg{font-weight:600}.callmsg.miss{color:#e53935}
/* ===== V2 (27-11-2026): diseño propio, neutro, con los boomerangs del icono ===== */
:root{--v2bg:#eef0ee;--v2card:#fff;--v2line:#e3e6e3;--v2sub:#7a8487;--v2muted:#e8ebe8;--v2me:#dfeee6;--v2them:#fff;--v2ink:#22282a;--v2frame:#22282a88;--v2bar:#fff}
html.dark{--v2bg:#121517;--v2card:#1b2023;--v2line:#262b2e;--v2sub:#8d979b;--v2muted:#2a3033;--v2me:#25332e;--v2them:#1e2326;--v2ink:#e7eaec;--v2frame:#ffffffa0;--v2bar:#171b1d}
/* barra y pestañas */
.bar{background:var(--v2bar);color:var(--v2ink);border-bottom:1px solid var(--v2line)}
.bar .name{color:var(--v2ink);font-weight:700;letter-spacing:-.3px}.bar .ib,.bar .star{color:var(--v2ink)}.bar .back{color:var(--v2ink)}
.tabs{background:var(--v2bar);border-bottom:1px solid var(--v2line)}
.tabs button{color:var(--v2sub);font-weight:600;font-size:13px;border-bottom:0}.tabs button.on{color:var(--v2ink)}
.tabs .ind{height:3px;background:transparent}.tabs .ind::after{content:'';position:absolute;left:50%;bottom:0;width:30px;height:3px;border-radius:3px;background:#2fc23a;transform:translateX(-50%)}
.pager{background:var(--v2bg)}
/* listas en tarjetas */
.page .item,.page .ev{height:auto;min-height:72px;margin:8px 12px 0;border-radius:18px;border:0;background:var(--v2card);padding:11px 14px;box-shadow:0 1px 2px #0000000d}
html.dark .page .item,html.dark .page .ev{background:var(--v2card);box-shadow:none}
.page .ev.new{background:var(--v2card);position:relative}.page .ev.new::before{content:'';position:absolute;left:5px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#e8352b}
html.dark .page .ev.new{background:var(--v2card)}
.item .t{font-size:17px;font-weight:600;color:var(--v2ink)}html.dark .item .t{color:var(--v2ink)}.item .s{font-size:14px;color:var(--v2sub)}
.grp{border-top:0;color:var(--v2sub);font-size:13px;padding:14px 16px 2px}
.pad.section{color:var(--v2sub)}
/* tarjeta de código: QR en miniatura con los 4 boomerangs del color de cada medio */
.qrt{position:relative;width:58px;height:58px;flex:none;padding:8px;cursor:pointer}
.qrt .q{width:100%;height:100%;border-radius:4px;overflow:hidden;background:#fff}
.item.off .qrt .q{opacity:.45}
.cselbar{display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:0;z-index:3;background:var(--v2card,#fff)}.cselact{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}.cselact .btn{width:auto;flex:1 1 40%;margin:0}.csck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #9aa0a6;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}.csck.on{background:#2fc23a;border-color:#2fc23a}.item.off .mcp{background:#8d979b}
.qrt .bfr{inset:0}.qrt .bfr i{width:16px;height:16px}
.chips{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.chips span{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:8px;background:var(--v2muted);color:var(--v2sub)}
.sw2{width:46px;height:28px;border-radius:14px;background:#2fc23a;position:relative;flex:none;border:0;cursor:pointer;transition:background .2s}.sw2::after{content:'';position:absolute;top:3px;left:21px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px #0003}
.sw2.off{background:var(--v2muted)}.sw2.off::after{left:3px}
.item .ib.set2{color:var(--v2sub);padding:6px}
/* marco de 4 boomerangs (forma exacta del icono; las esquinas son espejos) */
.bfr{position:absolute;inset:-8px;pointer-events:none;z-index:1}
.bfr i{position:absolute;width:20px;height:20px;color:#2fc23a;display:block}
.bfr i svg{width:100%;height:100%;display:block}
.bfr .tl{left:0;top:0}.bfr .tr{right:0;top:0;transform:scaleX(-1)}.bfr .bl{left:0;bottom:0;transform:scaleY(-1)}.bfr .br{right:0;bottom:0;transform:scale(-1,-1)}
/* chat */
#app.full{background:var(--v2bg)}
#cb{background:var(--v2bg)}
.qst{font-size:13px;color:var(--v2sub,#888);text-align:center;margin-top:12px}
.dayr{display:flex;gap:6px}.dayr label{cursor:pointer}.dayr input{display:none}.dayr span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(128,128,128,.45);font-weight:700;font-size:13px}.dayr input:checked+span{background:#2fc23a;border-color:#2fc23a;color:#fff}
.srbar{position:absolute;left:0;right:0;top:100%;z-index:8;display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--v2card,#1b2023);border-bottom:1px solid rgba(128,128,128,.25)}.srbar input{flex:1;min-width:0;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid rgba(128,128,128,.35);background:transparent;color:inherit}.srbar button{background:none;border:0;color:inherit;font-size:15px;padding:6px}.srbar span{font-size:12px;opacity:.7;min-width:30px;text-align:center}#ms .m.hit{outline:2px solid rgba(232,185,35,.55);outline-offset:2px}#ms .m.hitc{outline:3px solid #e8b923}
.mdel{display:block;margin:18px auto 6px;background:none;border:0;color:#e8352b;font-size:13.5px;text-decoration:underline;cursor:pointer}
#lockv{position:fixed;inset:0;z-index:99999;background:#121519;color:#fff;display:grid;place-items:center}.lockb{display:flex;flex-direction:column;align-items:center;width:min(320px,86vw);text-align:center}#lockp{width:100%;font-size:28px;letter-spacing:.4em;text-align:center;padding:10px;border-radius:12px;border:1px solid #3a3f45;background:#1b2023;color:#fff;margin-bottom:4px}
/* trazabilidad: cada sección enmarcada con su color y el título fijo arriba al bajar */
.tsec{--tc:#2fc23a;margin:14px 8px 6px;border:2px solid var(--tc);border-radius:18px;padding-bottom:6px}.tsec.tscan{--tc:#1f86e0}.tsech{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:var(--tc);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.05em;padding:9px 14px;border-radius:15px 15px 0 0;margin:-1px -1px 4px}.tsech span{flex:1}.tsech small{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:12px}.tsech svg{flex:none}
#cvl{background:none;border:0;color:#fff;width:46px;height:46px;display:grid;place-items:center;border-radius:50%}#cvl.on{color:#ffd23f;background:rgba(255,210,63,.18)}#cvl.on svg{fill:#ffd23f}
.cbgg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:52vh;overflow-y:auto}.cbgo{border:2px solid transparent;border-radius:14px;padding:4px;background:none;color:inherit;font:inherit;cursor:pointer}.cbgo span{display:block;height:84px;border-radius:10px;border:1px solid rgba(128,128,128,.25)}.cbgo small{display:block;font-size:11.5px;margin-top:4px;opacity:.8}.cbgo.on{border-color:#2fc23a}
.msgs{gap:10px;padding:14px 14px 10px}
.m{border-radius:18px;border:0;box-shadow:none;font-size:16.5px;padding:9px 13px 6px;max-width:78%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .15s}
.m.them::before,.m.me::after{display:none}
.m.me{background:var(--v2me);color:var(--v2ink);margin-right:0;border-bottom-right-radius:6px}
.m.them{background:var(--v2them);color:var(--v2ink);margin-left:0;border-bottom-left-radius:6px}
html:not(.dark) .m.them{box-shadow:0 1px 2px #0000000f}
html.dark .m.me{background:var(--v2me);color:var(--v2ink)}html.dark .m.them{background:var(--v2them);color:var(--v2ink)}
.m .tm{color:var(--v2sub);font-size:11.5px}html.dark .m .tm{color:var(--v2sub)}
.daysep span{background:var(--v2card);color:var(--v2sub);font-weight:600;text-transform:none}html.dark .daysep span{background:var(--v2card);color:var(--v2sub)}
.compose{background:var(--v2bar);border-top:1px solid var(--v2line)}html.dark .compose{background:var(--v2bar);border-top-color:var(--v2line)}
.compose input{background:var(--v2bg);border:0;border-radius:22px;padding:11px 16px;color:var(--v2ink)}
.m.pinned{margin-top:4px;margin-bottom:4px}
.m.selm{z-index:2}.m.selm .bfr.sf i{color:#2fc23a}
.m.flash{animation:flash 1.2s ease}@keyframes flash{0%,40%{box-shadow:0 0 0 3px #2fc23a88}100%{box-shadow:0 0 0 0 #2fc23a00}}
.m.swr{box-shadow:-6px 0 0 -2px #2fc23a}
/* enviar = escanear */
.m.scan{animation:scpop .5s ease both}@keyframes scpop{0%{opacity:0;transform:translateY(12px)}40%{opacity:1;transform:none}}
.bfr.scanf i{animation:scclose .34s cubic-bezier(.2,.9,.3,1.15) both}
.bfr.scanf .tl{--x:-14px;--y:-12px}.bfr.scanf .tr{--x:14px;--y:-12px;--s:-1,1}.bfr.scanf .bl{--x:-14px;--y:12px;--s:1,-1}.bfr.scanf .br{--x:14px;--y:12px;--s:-1,-1}
@keyframes scclose{from{opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s,1,1))}to{opacity:1;transform:translate(0,0) scale(var(--s,1,1))}}
.bfr.scanf{color:var(--v2frame);animation:scout .3s ease .62s both}.bfr.scanf i{color:var(--v2frame)}@keyframes scout{to{opacity:0;transform:scale(.97)}}
.scanl{position:absolute;left:6px;right:6px;height:2px;border-radius:2px;background:#ff4b3e;box-shadow:0 0 8px 1px #ff4b3e88;top:0;opacity:0;pointer-events:none;animation:scln .3s ease-in-out .3s both}
@keyframes scln{0%{top:3px;opacity:0}20%{opacity:1}100%{top:calc(100% - 5px);opacity:0}}
/* respuesta, reacciones */
.quote{border-left:3px solid #2fc23a;background:#00000010;border-radius:8px;padding:4px 9px;margin:1px 0 5px;font-size:13.5px;line-height:1.3;cursor:pointer;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
html.dark .quote{background:#ffffff12}.quote b{display:block;font-size:12px;color:#1a9c2a}html.dark .quote b{color:#5fd36b}
.rxs{position:absolute;bottom:-13px;right:10px;background:var(--v2card);border-radius:12px;padding:1px 7px;font-size:14px;box-shadow:0 1px 4px #0003;white-space:nowrap;z-index:2}
.m.them .rxs{right:auto;left:10px}.rxs b{font-size:11px;font-weight:600;color:var(--v2sub);margin-left:3px}
.m:has(.rxs){margin-bottom:12px}
.rpbar{display:flex;align-items:center;gap:8px;padding:8px 10px 0;background:var(--v2bar);flex:none}.rpbar .quote{flex:1;margin:0;cursor:default}
.rpbar button{border:0;background:none;color:var(--v2sub);font-size:18px;padding:6px;cursor:pointer}
/* mensaje fijado arriba */
.pinbar{position:relative;margin:10px 16px 6px;padding:8px 12px 8px 40px;border-radius:14px;background:var(--v2card);color:var(--v2ink);font-size:14px;line-height:1.3;flex:none;cursor:pointer;z-index:2}
html:not(.dark) .pinbar{box-shadow:0 1px 3px #0000001a}
.pinbar .bfr{inset:-6px}.pinbar .bfr i{width:17px;height:17px}
.pinbar b{display:block;font-size:10.5px;letter-spacing:.4px;color:var(--v2sub)}.pinbar .pt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinbar .pi{position:absolute;left:12px;top:50%;transform:translateY(-50%) rotate(30deg);color:var(--v2sub);line-height:0}.pinbar .pi svg{width:17px;height:17px}
/* fecha fija arriba */
.fdw{position:sticky;top:6px;height:0;z-index:4;display:flex;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none}.fdw.on{opacity:1}

const fileMeta = b => { const [u, m = ''] = b.slice(4).split('#'), i = m.indexOf('|'), size = +m.slice(0, i) || 0; let name = 'archivo'; try { name = decodeURIComponent(m.slice(i + 1)) || name; } catch (e) {} return { u, size, name }; };
const fSize = n => n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const fileBody = b => { const { u, size, name } = fileMeta(b), ext = (name.match(/\.(\w{1,5})$/) || [, '?'])[1].toUpperCase();
  return `<a class="filw" href="${esc(u)}?download=${encodeURIComponent(name)}" target="_blank" rel="noopener"><i class="fic">${esc(ext)}</i><span class="fnm"><b>${esc(name)}</b><small>${fSize(size)} · Descargar</small></span></a>`; };

const vidBody = b => { const u = b.slice(4).replace(/#.*$/, ''), s = +(b.match(/#(\d+)$/) || [])[1] || 0; return `<div class="vidw"><video class="mvid" playsinline preload="metadata" poster="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" src="${esc(u)}#t=0.1"></video><button class="vplay" aria-label="Reproducir"><span></span></button><em class="vdur">▶ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}</em>${/[?&]src=cam\b/.test(u) ? '<span class="phsrc cam vsrc">🎥 Grabado desde la cámara</span>' : /[?&]src=gal\b/.test(u) ? '<span class="phsrc vsrc">🖼️ De la galería</span>' : ''}</div>`; };
// audios y vídeos: el tic verde sale cuando la otra persona los reproduce (no basta con abrir el chat)
const isPlayable = b => isAudio(b) || isVideo(b);
const isLoc = b => typeof b === 'string' && /^loc:-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$/.test(b);
const prevBody = b => /^dl(:\d+)?$/.test(b || '') ? '🚫 Mensaje borrado' : /^rx:\d+:/.test(b || '') ? (b.replace(/^rx:\d+:/, '') ? 'Ha reaccionado ' + b.replace(/^rx:\d+:/, '') : 'Ha quitado su reacción') : (b || '').startsWith('rp:{') ? '↩️ ' + prevBody((() => { try { return JSON.parse(b.slice(3)).b; } catch (e) { return ''; } })()) : /^cal:(missed|\d+)$/.test(b || '') ? (b === 'cal:missed' ? '📞 Llamada perdida' : '📞 Llamada') : isVideo(b) ? '🎥 Vídeo' : isFile(b) ? '📎 ' + fileMeta(b).name : isPhoto(b) ? '📷 Foto' : isAudio(b) ? '🎤 Audio' : isLoc(b) ? '📍 Ubicación' : (emoParse(b)?.t ?? b ?? '');

  const [lat, lng] = b.slice(4).split(',').map(Number), z = 15, n = 2 ** z, W = 230, H = 130;

// fotos que se están subiendo: se ven ya en el chat con un círculo de carga
const S_PEND = {};

const audBody = b => { const u = b.slice(4).replace(/#.*$/, ''), s = +(b.match(/#(\d+)$/) || [])[1] || 0; let h = 7; for (const ch of u) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const bars = Array.from({ length: 28 }, (_, i) => { h = (h * 1103515245 + 12345) >>> 0; return 5 + Math.round((0.35 + 0.65 * Math.sin(i / 27 * Math.PI)) * (6 + (h >>> 16) % 18)); });

async function sendFile(chatId, f, sendBody) {

  if (f.size > FILE_MAX) return toast('El archivo pesa ' + fSize(f.size) + '. El máximo son 10 MB.');
  const done = pendAdd(chatId, { k: 'fil', name: f.name, size: f.size });
  try {
    const path = `${chatId}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from('chat-files').upload(path, f, { contentType: type }); if (error) throw error;
    done(); await sendBody('fil:' + FILE_URL + path + '#' + f.size + '|' + encodeURIComponent(f.name.slice(-120)));
  } catch (e) { done(); render(); toast('No se ha podido enviar el archivo.'); }
}

/* ---------------- historial en el móvil ----------------
   El servidor solo guarda los mensajes de paso: la app del móvil guarda su copia (textos en IndexedDB y fotos,
   audios y archivos en la caché del navegador) y avisa al servidor de hasta dónde la tiene (sync_ack).
   El servidor los borra cuando los tienen los móviles de todas las personas del chat, o a los 7 días.
   La web del ordenador no cuenta: pide el historial al móvil por un canal privado (hist:<usuario>). */

})();

const histKey = () => 'hist_' + S.user.id;

// fotos, audios y archivos: copia en la caché del móvil
const MEDIA_RX = /^(img|aud|fil|vid):(https:\/\/kbkyosyenotqjcgujbmn\.supabase\.co\/storage\/v1\/object\/public\/[^#]+)/;
const mediaUrl = b => (typeof b === 'string' && b.match(MEDIA_RX) || [])[2] || '';
const MCACHE = 'scan2com-media', mBlobs = new Map(), mHave = new Set();
async function mediaCached(u) { if (mHave.has(u)) return true; try { const c = await caches.open(MCACHE); if (await c.match(u)) { mHave.add(u); return true; } } catch (e) {} return false; }

  try { const c = await caches.open(MCACHE), r = await c.match(u); if (r) { mHave.add(u); return await r.blob(); } } catch (e) {}
  const r = await fetch(u); if (!r.ok) throw new Error('gone');
  const b = await r.clone().blob(); try { await (await caches.open(MCACHE)).put(u, r); mHave.add(u); } catch (e) {} return b;
}
let mBusy = false;
async function cacheAllMedia() {
  if (mBusy || !S.user) return; mBusy = true;
  try {
    const all = [...Object.values(S.msgs || {}).flat(), ...Object.values(S.vmsgs || {}).flat()].map(m => mediaUrl(m.body)).filter(Boolean);
    for (const u of all) { if (await mediaCached(u)) continue; try { await mediaBlob(u); } catch (e) { if (!IS_PHONE) histMedia(u); } }
  } finally { mBusy = false; }

// en pantalla, las fotos, audios y archivos salen de la copia guardada (sirve aunque el servidor ya los haya borrado)
async function hydrateMedia() {
  for (const el of document.querySelectorAll('#ms img.mph, #ms audio, #ms video.mvid, #ms a.filw')) {
    const raw = el.dataset.u || (el.tagName === 'A' ? el.getAttribute('href').split('?')[0] : el.getAttribute('src')); if (!raw || raw.startsWith('blob:')) continue;
    el.dataset.u = raw; const u = raw.split('#')[0];
    let bu = mBlobs.get(u);
    if (!bu && await mediaCached(u)) { try { bu = URL.createObjectURL(await mediaBlob(u)); mBlobs.set(u, bu); } catch (e) {} }
    if (!bu) { if (!IS_PHONE && !el.dataset.asked) { el.dataset.asked = 1; fetch(u, { method: 'HEAD' }).then(r => { if (!r.ok) { histMedia(u); el.closest('.m')?.classList.add('gone'); } }, () => {}); } continue; }
    if (el.tagName === 'A') { el.dataset.blob = bu; } else el.src = bu + (el.tagName === 'VIDEO' ? '#t=0.1' : '');

// al reproducir un audio o vídeo de la otra persona se le avisa de hasta dónde ha llegado (0-100 %):
// su boomerang vuelve en esa proporción y al 100 % sale el tic verde
const pctOf = id => (S.ppct || {})[id] || 0;
const playSent = {}; let playT = 0;
function playReport(id, pct) {
  if (pct <= (playSent[id] || 0)) return; (S.ppct ||= {})[id] = Math.max(pctOf(id), pct);
  const go = () => { playT = 0; const v = S.ppct[id]; if (v <= (playSent[id] || 0)) return; playSent[id] = v; saveHist();
    if (v >= 100) { const vw = S.view, gc = vw?.t === 'chat' ? S.chats.find(x => x.id === vw.id) : null, gv = vw?.t === 'vchat' ? (S.vchats || []).find(x => x.id === vw.id) : null;
      if (gc?.is_group) sb.rpc('group_played_full', { p_chat: gc.id, p_msg: id }).then(() => {}, () => {}); else if (gv?.group) sb.rpc('group_played_full', { p_chat: gv.id, p_msg: id, p_token: gv.token }).then(() => {}, () => {}); }
    if (S.view?.t === 'chat') sb.rpc('mark_played', { p_msg: id, p_pct: v, p_chat: S.view.id }).then(r => { if (r.error) playSent[id] = 0; else v2Ping(); }, () => { playSent[id] = 0; });
    else if (S.view?.t === 'vchat') { const ch = (S.vchats || []).find(x => x.id === S.view.id); if (ch) sb.rpc('visitor_played', { p_chat: ch.id, p_token: ch.token, p_msg: id, p_pct: v }).then(r => { if (r.error) playSent[id] = 0; }, () => { playSent[id] = 0; }); } };
  // se avisa cada 5 % o, como mucho, cada segundo mientras se reproduce (el boomerang del otro avanza casi a la vez); al terminar, al momento
  if (pct >= 100 || pct - (playSent[id] || 0) >= 5) { clearTimeout(playT); go(); } else if (!playT) playT = setTimeout(go, 1000);
}
['timeupdate', 'ended', 'pause'].forEach(ev => document.addEventListener(ev, e => {
  const el = e.target, m = el.closest?.('[data-pm]'); if (!m) return; const id = +m.dataset.pm;
  // duración: la que midió quien lo grabó manda si el vídeo dice otra cosa (los vídeos de la cámara a veces traen una duración falsa y nunca llegaban al 100 %)
  const d1 = isFinite(el.duration) && el.duration > 0 ? el.duration : 0, d2 = +m.dataset.secs || 0, dur = d1 && d2 ? Math.min(d1, d2) : d1 || d2;
  const near = dur >= 4 && el.currentTime >= dur - 1.2;   // a punto de acabar (o parado al final): cuenta como visto entero
  const pct = ev === 'ended' || near ? 100 : dur ? Math.min(100, Math.round(el.currentTime / dur * 100)) : 0;
  if (pct >= 98) return playReport(id, 100); if (pct > 0) playReport(id, pct);
}, true));
// archivo: se descarga desde la copia del móvil (o del servidor si aún está)
document.addEventListener('click', async e => {

    try { await P.Filesystem.writeFile({ path: 'Scan2Com/' + name, data: b64, directory: 'DOCUMENTS', recursive: true }); return toast('Archivo guardado en Documentos/Scan2Com'); }
    catch (err) { try { const f = await P.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' }); return await P.Share.share({ title: name, files: [f.uri], dialogTitle: 'Guardar archivo' }); } catch (e2) { return toast('No se ha podido guardar el archivo.'); } }
  }
  const x = document.createElement('a'); x.href = URL.createObjectURL(blob); x.download = name; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(x.href), 4000);

// el móvil avisa al servidor de hasta qué mensaje tiene copia completa (con sus fotos, audios y archivos)
let ackT = 0; const acked = {};
function ackSoon() { if (!IS_PHONE || !S.user) return; clearTimeout(ackT); ackT = setTimeout(doAck, 1500); }
async function doAck() {
  const jobs = [];
  const upto = async list => { let u = 0; for (const m of list || []) { const mu = mediaUrl(m.body); if (mu && !(await mediaCached(mu))) break; u = m.id; } return u; };
  for (const [cid, list] of Object.entries(S.msgs || {})) { const u = await upto(list); if (u > (acked[cid] || 0)) jobs.push([cid, u]); }
  for (const [cid, list] of Object.entries(S.vmsgs || {})) { const u = await upto(list); if (u > (acked[cid] || 0)) jobs.push([cid, u]); }
  let any = false;
  for (const [cid, u] of jobs) { try { const { data } = await sb.rpc('sync_ack', { p_chat: cid, p_upto: u }); if (data?.ok) { acked[cid] = u; any = true; } } catch (e) {} }
  if (any) fetch(PUSH_FN + '?purge=1', { method: 'POST', body: '{}' }).catch(() => {});   // el servidor borra lo que ya tienen todos
}
// ---- el ordenador pide el historial al móvil (canal privado de la cuenta); el móvil responde si tiene la app abierta
let hch = null, phoneSeen = 0; const mWait = new Map();
function histChannel() {
  if (!S.user || hch) return;
  hch = sb.channel('hist:' + S.user.id, { config: { private: true, broadcast: { self: false } } })
    .on('broadcast', { event: 'req' }, ({ payload }) => { if (IS_PHONE) histSend(payload); })
    .on('broadcast', { event: 'here' }, () => { if (!IS_PHONE) { phoneSeen = Date.now(); updHint(); histAsk(); } })
    .on('broadcast', { event: 'hist' }, ({ payload }) => { if (IS_PHONE) return; phoneSeen = Date.now(); updHint(); histTake(payload); })
    .on('broadcast', { event: 'mreq' }, ({ payload }) => { if (IS_PHONE) mediaSend(payload.u); })
    .on('broadcast', { event: 'mpart' }, ({ payload }) => { if (!IS_PHONE) mediaTake(payload); })
    .subscribe(st => { if (st !== 'SUBSCRIBED') return; if (IS_PHONE) hch.send({ type: 'broadcast', event: 'here', payload: {} }); else histAsk(); });
}
function histAsk() { hch?.send({ type: 'broadcast', event: 'req', payload: { have: Object.fromEntries(Object.entries(S.msgs || {}).map(([k, l]) => [k, l[0]?.id || 0])) } }); }
async function histSend() {
  const all = [...Object.entries(S.msgs || {}).map(([k, l]) => ['o', k, l]), ...Object.entries(S.vmsgs || {}).map(([k, l]) => ['v', k, l])];
  for (const [t, k, l] of all) for (let i = 0; i < l.length; i += 150) await hch.send({ type: 'broadcast', event: 'hist', payload: { t, k, l: l.slice(i, i + 150), vr: t === 'v' ? S.vread?.[k] : undefined, r: t === 'o' ? S.reads?.[k] : undefined } });
}
function histTake({ t, k, l, vr, r }) {
  if (t === 'o') { S.msgs[k] = mergeById(l, S.msgs[k]); if (r) S.reads[k] = { ...S.reads[k], visitor_upto: Math.max(S.reads[k]?.visitor_upto || 0, r.visitor_upto || 0) }; }
  else { S.vmsgs ||= {}; S.vmsgs[k] = mergeById(l, S.vmsgs[k]); if (vr) S.vread[k] = Math.max(S.vread[k] || 0, vr); const v = (S.vchats || []).find(x => x.id === k); if (v && S.vmsgs[k].length) v.last = { ...S.vmsgs[k].at(-1) }; }
  saveHist(); clearTimeout(histTake.t); histTake.t = setTimeout(() => { render(true); hydrateMedia(); }, 300);
}
function histMedia(u) { if (IS_PHONE || mWait.has(u)) return; mWait.set(u, []); hch?.send({ type: 'broadcast', event: 'mreq', payload: { u } }); }
async function mediaSend(u) {
  let b; try { if (!(await mediaCached(u))) return; b = await mediaBlob(u); } catch (e) { return; }
  const d = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(b); }), N = 150000, n = Math.ceil(d.length / N);

async function mediaTake({ u, i, n, type, d }) {

let channel = null;
function subscribe() {
  channel?.unsubscribe();
  channel = sb.channel('owner')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async ({ new: m }) => {
      if (!S.chats.find(c => c.id === m.chat_id)) { const { data } = await sb.from('chats').select('id,code_id,name,created_at,blocked,code_name,note,avatar,calls,is_group').eq('id', m.chat_id).single(); if (data) S.chats.unshift(data); }
      const list = (S.msgs[m.chat_id] ||= []); if (!list.find(x => x.id === m.id)) list.push(m); saveHist(); if (mediaUrl(m.body)) cacheAllMedia();
      if (m.from_visitor) deliveredAll();
      if (m.from_visitor) {
        const viewing = S.view?.t === 'chat' && S.view.id === m.chat_id && !document.hidden;
        if (viewing && V2.typing[m.chat_id]) V2.typing[m.chat_id] = 0;
        if (!viewing && !/^rx:\d+:/.test(m.body || '')) { S.unread[m.chat_id] = (S.unread[m.chat_id] || 0) + 1; ls.set('sa_unread', S.unread); }
        const ch = S.chats.find(c => c.id === m.chat_id), code = codeOf(ch?.code_id);
        if (!viewing) { toast(`💬 ${ch?.name || 'Chat'} · ${code?.name || ''}: ${prevBody(m.body)}`, () => { S.view = { t: 'chat', id: m.chat_id }; render(); }); notify('Nuevo mensaje · ' + (code?.name || 'Scan2Com'), prevBody(m.body)); beep(); }
      }
      render(true);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, ({ new: m }) => {
      const x = (S.msgs[m.chat_id] || []).find(y => y.id === m.id); if (!x || (x.read_at === m.read_at && x.played_pct === m.played_pct)) return;
      x.read_at = m.read_at; x.played_at = m.played_at; x.played_pct = m.played_pct; if (m.played_pct) (S.ppct ||= {})[m.id] = Math.max(pctOf(m.id), m.played_pct); saveHist(); if (S.view?.t === 'chat' && S.view.id === m.chat_id) render(true);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'calls' }, ({ new: c }) => callRow(c))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'msg_played' }, ({ new: r }) => { if (!r?.msg_id || !(r.pct > pctOf(+r.msg_id))) return; (S.ppct ||= {})[+r.msg_id] = r.pct; saveHist(); if ((S.view?.t === 'chat' || S.view?.t === 'vchat') && S.view.id === r.chat_id) render(true); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'msg_delivered' }, ({ new: r }) => { if (!r?.chat_id || r.who === S.user?.id || !dlvSet(r.chat_id, +r.upto)) return; saveHist(); if ((S.view?.t === 'chat' || S.view?.t === 'vchat') && S.view.id === r.chat_id) render(true); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'msg_sync' }, ({ new: r }) => { if (!r?.chat_id || r.who === S.user?.id || !dlvSet(r.chat_id, +r.upto)) return; saveHist(); if ((S.view?.t === 'chat' || S.view?.t === 'vchat') && S.view.id === r.chat_id) render(true); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_reads' }, ({ new: r }) => {
      if (!r?.chat_id) return; const o = S.reads[r.chat_id] || {}; S.reads[r.chat_id] = { ...r, visitor_upto: Math.max(o.visitor_upto || 0, r.visitor_upto || 0) }; saveHist();
      if (S.view?.t === 'chat' && S.view.id === r.chat_id) render(true);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'events' }, ({ new: e }) => {
      const i = S.events.findIndex(x => x.id === e.id); if (i >= 0) S.events[i] = { ...S.events[i], ...e };
      if (e.cancelled_at && S.alarm?.id === e.id) { sirenOff(); S.alarm = null; toast('✅ Alerta resuelta: quien te avisó dice que ya está solucionado.'); }
      render(true);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'events' }, ({ new: e }) => {
      S.events.unshift(e); const code = codeOf(e.code_id);
      if (e.kind === 'alert' || e.kind === 'call' || e.kind === 'police') {
        // con la app en pantalla suena aquí mismo; en la app Android se espera un momento por si ya salió la sirena nativa a pantalla completa
        const ring = () => { if (S.alarm?.id === e.id || e.read_at) return; S.alarm = e; sirenOn(); render(true); };
        if (!NATIVE || (!document.hidden && !S.paused)) ring(); else if (!notifOn()) ring(); notify((e.kind === 'police' ? '🚓 Aviso de la Policía · ' : '🔔 Alerta · ') + (code?.name || 'Scan2Com'), e.body || 'Alguien ha escaneado tu código y te avisa'); }
      else { toast(`✉️ Mensaje en “${code?.name || ''}”: ${e.body || ''}`, () => { S.tab = 'alerts'; S.view = null; render(); }); notify('✉️ Mensaje · ' + (code?.name || ''), e.body || ''); }
      render(true);
    })
    .subscribe();
}

function render(soft) {
  if (soft && document.activeElement?.id === 'rn') return;  // no cortar la edición del nombre
  const keep = soft && document.activeElement?.id ? { id: document.activeElement.id, v: document.activeElement.value } : null;
  app.classList.remove('homepg');
  if (S.view?.t !== 'chat' && S.view?.t !== 'vchat') { app.dataset.cv = ''; if (V2.sel || V2.reply || V2.typCh) { V2.sel = null; V2.reply = null; v2TypSub(); } }
  if (S.recovery) renderNewPass();
  else if (!S.user) renderAuth();
  else if (S.view?.t === 'edit') renderEdit();
  else if (S.view?.t === 'qr') renderQR();
  else if (S.view?.t === 'chat') renderChat();
  else if (S.view?.t === 'vchat') renderVChat();
  else if (S.view?.t === 'pack') renderPack();
  else renderHome();
  if (S.view?.t !== 'chat' && S.view?.t !== 'vchat') { app.classList.remove('full'); app.dataset.cv = ''; }
  if (S.view?.t !== 'vchat') clearInterval(vPoll);
  if (S.alarm) $('#overlay').innerHTML = alarmHTML(); else if (!$('#overlay .keep')) $('#overlay').innerHTML = '';
  if (S.touring && S.tourKeyNow) highlight(S.tourKeyNow);
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); } }
  fbkPlace();
}

function traduce(m) {

  if (/already registered/i.test(m)) return 'Ese email ya tiene cuenta. Prueba a entrar.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos. Espera unos minutos.';
  return m;

function renderHome() {

}
const chatBgName = () => { const id = chatBgId(); return id === 'none' ? 'Sin fondo' : id === 'photo' ? 'Tu foto' : CHATBG[id]?.n || ''; };

S.mutes = S.mutes || {};
const isMuted = id => { const u = S.mutes[id]; return u !== undefined && (u === null || Date.parse(u) > Date.now()); };
async function loadMutes() { try { const { data } = await sb.from('chat_mutes').select('chat_id,until'); S.mutes = Object.fromEntries((data || []).map(r => [r.chat_id, r.until])); } catch (e) {} }
function muteMenu(id) {
  if (isMuted(id)) { sb.from('chat_mutes').delete().eq('chat_id', id).eq('user_id', S.user.id).then(({ error }) => { if (error) return toast('No se ha podido cambiar.'); delete S.mutes[id]; toast('Vuelves a recibir avisos de este chat.'); render(true); }); return; }
  const opts = [['8 horas', 8], ['1 semana', 168], ['Siempre', 0]];
  $('#overlay').innerHTML = `<div class="sheet" id="mus"><div style="background:#fff;color:#222;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))" onclick="event.stopPropagation()">

function chatSearch() {

  const find = () => { const q = norm($('#srq').value.trim()); hits = q ? [...document.querySelectorAll('#ms .m[data-id]')].filter(e => norm(e.innerText).includes(q)) : []; k = hits.length - 1; show(); };

  const c = codeOf(id); if (!c) return; const own = c.owner_id === S.user.id, url = `${SITE}/s/${c.id}`;
  const it = [['qr', IC.eye(20), 'Ver código'], own && ['ed', IC.sliders(20), 'Ajustes'], ['sh', IC.shareL(20), 'Compartir'], ['pdf', IC.pdf(20), 'PDF para imprimir'], own && ['pw', IC.power(20), c.is_on ? 'Apagar' : 'Encender']].filter(Boolean);
  $('#overlay').innerHTML = `<div class="sheet" id="cmq"><div style="background:#fff;color:#222;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))" onclick="event.stopPropagation()">
    <div style="font-weight:700;font-size:17px;margin-bottom:10px">${esc(c.name || c.public_name || 'Código')}</div>${it.map(([k, ic, l]) => `<button class="btn light" data-cq="${k}" style="margin-bottom:8px;justify-content:flex-start;gap:12px">${ic}${l}</button>`).join('')}</div></div>`;
  $('#cmq').onclick = () => { $('#overlay').innerHTML = ''; };
  $('#cmq').querySelectorAll('[data-cq]').forEach(b => b.onclick = () => { const k = b.dataset.cq; $('#overlay').innerHTML = '';
    if (k === 'qr') { S.view = { t: 'qr', id }; render(); } else if (k === 'ed') { S.view = { t: 'edit', id }; render(); } else if (k === 'sh') shareCode(c, url); else if (k === 'pdf') carSheetAsk(c, url); else if (k === 'pw') togglePower(id); });
}
async function togglePower(id) {
  const c = codeOf(id); if (!c || c.owner_id !== S.user.id) return toast('Solo el dueño puede encender o apagar este código.');
  c.is_on = !c.is_on; render();
  const { error } = await sb.from('codes').update({ is_on: c.is_on }).eq('id', id);
  if (error) { c.is_on = !c.is_on; render(); toast('No se ha podido guardar.'); } else toast(c.is_on ? `“${c.name}” activado` : `“${c.name}” desactivado: nadie nuevo puede entrar; los chats ya abiertos siguen funcionando`);
}

function pdfFromJpeg(jpgDataUrl, pw, ph, wmm, hmm, pagew = 210, pageh = 297, note = '') {

    `<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n${img}\nendstream`];

  const xr = out.length; out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');

}

async function markRead(ids) { ids = ids.filter(Boolean); if (!ids.length) return; const now = new Date().toISOString(); S.events.forEach(e => { if (ids.includes(e.id)) e.read_at = e.read_at || now; }); await sb.rpc('mark_events_read', { p_ids: ids }); }

/* ---------- versión: ¿está instalada la última? ---------- */
const APK_URL = 'https://www.scan2com.com/app/scan2com.apk';
const fmtD = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? '' : x.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
async function checkVersion(manual) {
  const g = async f => { try { const r = await fetch(`/app/${f}?t=${Date.now()}`, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const [web, apk] = await Promise.all([g('version-web.json'), g('version-apk.json')]);
  let build = null; try { if (NATIVE && window.Capacitor.Plugins.App) build = Number((await window.Capacitor.Plugins.App.getInfo()).build) || null; } catch (e) {}
  // la página cargada es antigua (caché del móvil): se recarga una vez con la nueva
  if (web && WEB_BUILD.id !== 'dev' && web.id !== WEB_BUILD.id) {
    const k = 'sa_reload_' + web.id;
    if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, 1); location.replace('/app/?v=' + web.id); return; }
  }
  const old = !!(NATIVE && apk && build && build < apk.build);
  const last = [web?.date, apk?.date].filter(Boolean).sort().pop() || WEB_BUILD.date;
  S.ver = { web, apk, build, old, last, ok: !!(web || apk) }; if (old) render();
  if (old) toast('Hay una versión nueva de Scan2Com. Toca aquí para actualizar.', () => { location.href = APK_URL; });
  else if (manual) toast(S.ver.ok ? 'Tienes la última versión (' + fmtD(last) + ').' : 'No se ha podido comprobar la versión. Revisa la conexión.');
}

/* ---------- arranque ---------- */
async function start(session) {
  S.user = session?.user || null;
  if (!S.user) { channel?.unsubscribe(); return render(); }
  app.innerHTML = `<div style="position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:30"><img src="/app/img2014/icon.png" width="170" height="170" alt="Scan2Com" onerror="this.src='/app/icon-192.png'"></div>`;
  await loadAll(); await ensureStarter(); await ensureCar(); subscribe(); render(); syncAuto(); zoneGeo(); checkTerms(); setTimeout(() => mailCarSheet(), 3000);
  if (location.search) { openUrl(location.href); history.replaceState(null, '', '/app/'); }
  checkVersion();
  if (NATIVE) { await Promise.race([enableNativePush(false), new Promise(r => setTimeout(r, 5000))]); avInit(); } else if (pushOK() && Notification.permission === 'granted') enablePush(false);
}
/* ---------- vídeo de bienvenida: solo la primera vez que se abre la app ---------- */
(function intro() {
  if (ls.get('sa_intro_v1', 0)) return;
  const d = document.createElement('div');
  d.id = 'intro'; d.style.cssText = 'position:fixed;inset:0;background:#000;z-index:60;display:grid;place-items:center;transition:opacity .5s';
  d.innerHTML = '<video poster="data:image/gif;base64,R0lGODlhAQABAAAAACw=" src="/app/scanand_splash_movil.mp4" autoplay muted playsinline preload="auto" style="width:100%;height:100%;object-fit:contain"></video><button style="position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:18px;padding:8px 16px;font:inherit;font-size:14px">Saltar ›</button>';
  document.body.appendChild(d);
  const end = () => { ls.set('sa_intro_v1', 1); d.style.opacity = '0'; setTimeout(() => d.remove(), 500); };
  const v = d.querySelector('video'); v.onended = end; v.onerror = end; d.querySelector('button').onclick = end;
  setTimeout(() => { if (document.body.contains(d) && v.currentTime === 0) end(); }, 5000);  // si no se puede reproducir, no bloquear
})();
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && !S.user) start(session); if (ev === 'SIGNED_OUT') { S.user = null; render(); } if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; render(); } });
const { data: { session } } = await sb.auth.getSession(); if (!S.user || S.user.id !== session?.user?.id) start(session);  // no arrancar dos veces (SIGNED_IN + getSession) con la misma cuenta
document.addEventListener('visibilitychange', async () => { if (document.hidden && S.touring) stopTour(); if (document.hidden && S.view?.t === 'pack' && S.view.only) stopCam(); if (!document.hidden) setTimeout(scanResume, 300); if (!document.hidden && S.user) { if (S.view?.t === 'edit') { refreshAutoPerm(); return; } await loadAll(); render(true); zoneGeo(); } });
try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/app/sw.js').catch(() => {}); navigator.serviceWorker.addEventListener('message', ev => { if (ev.data?.type === 'open' && S.user) openUrl(ev.data.url); }); }
</script>
